PreToolUse:
  - matcher: Bash
    type: command
    command: "echo \"Running: $(jq -r '.tool_input.command' < /dev/stdin)\""
  - matcher: Edit|Write|NotebookEdit|Bash|PowerShell
    type: command
    command: agentsmesh lessons hook
PostToolUse:
  - matcher: Edit|Write
    type: command
    command: jq -r '.tool_input.file_path' | xargs eslint --fix
UserPromptSubmit:
  - matcher: "*"
    type: command
    command: agentsmesh lessons hook
PostToolUseFailure:
  - matcher: "*"
    type: command
    command: agentsmesh lessons hook
SessionStart:
  - matcher: "*"
    type: command
    command: agentsmesh lessons hook
